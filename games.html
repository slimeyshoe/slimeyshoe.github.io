<html>
	<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/slimyshoeclear.png">

<title>The Shoe Shelf</title>
<style>


body{
	margin:0;
	flex:1;
    font-family:Arial, Helvetica, sans-serif;
	cursor:default;
	min-height: 100vh;
    background-image: url('images/background.gif');
	background-size: cover;
}

/* navi bar */

header{
	position:fixed;
	box-sizing: border-box;
	width:100%;
	background-color:rgba(0,0,0,0.75);
    border-bottom:4px solid #aa85ff;
    padding:18px;
	display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
	color:#aa85ff;
    font-size:26px;
	text-decoration:none;
    font-weight:bold;
    transition:.25s;
}

.logo:hover{
    color:#58fa59;
    transform:translateY(-5px) scale(1.02);
}

nav a{
	font-weight:bold;
    color:#aa85ff;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
    transition:.25s;
}

nav a:hover{
    color:#58fa59;
	transform:translateY(-5px) scale(1.02);
}

/* Hero */

.hero{
    text-align:center;
    padding:100px 20px;
}

.hero h1{
    font-size:42px;
}

.hero p{
    display:flex;
    justify-content:center;
    align-items:center;
	font-weight:bold;
    color:#58fa59;
}

/*Section*/

h1{
	color:#aa85ff;
    font-size:26px;
	text-decoration:none;
    font-weight:bold;
    transition:.25s;
}

h1:hover{
    color:#58fa59;
    transform:translateY(-5px) scale(1.02);
}

.container{
    padding:40px 8%;
}

.section-title{
    font-size:24px;
    margin-bottom:20px;
}

/* Footer */

footer{
    margin-top:40px;
    padding:20px;
    text-align:center;
    background:#111;
    color:#666;
}

/* MAIN */
.container{
    max-width:1280px;
    margin:auto;
    padding:20px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:15px;
}

/* CARD */
.card{
    background-color:rgba(0,0,0,0.75);
    border:4px solid #aa85ff;
    border-radius:12px;
    padding:10px;
    text-decoration:none;
	color:#58fa59;
	font-weight:bold;
    transition:0.25s;
}

.card:hover{
    transform:translateY(-3px);
	color:#aa85ff;
    border-color:#58fa59;
	font-weight:default;
}

.thumb{
    width:100%;
    height:90px;
    background:#222;
    border-radius:4px;
    margin-bottom:8px;
}

.name{
    font-size:14px;
}

.search-bar{
    display:flex;
    margin-top:-50px;
    justify-content: center;
    color:#58fa59;
}

.search-bar input{
    width:60%;
    max-width:400px;
    padding:10px;
    border-radius:8px;
    border:4px solid #aa85ff;
    background:rgba(0,0,0,0.75);
    color:#58fa59;
    font-size:14px;
    outline:none;
    transition:.25s;
}

.search-bar input:hover{
    border-color:#58fa59;
}

.search-bar input:focus{
	color:#aa85ff;
    border-color:#58fa59;
}

</style>

<header>

<div>
<a href="index.html" class="logo">The Shoe Shelf</a>
</div>

<nav>
<a href="index.html">Home</a>
<a href="tools.html">Tools</a>
<a href="chatroom.html">Chat</a>
<a href="games.html">Games</a>
<a href="about.html">About</a>
</nav>

</header>
</head>

<body>

<div class="hero">

<h1>All Games</h1>

<p>The best goy-boy game selection out there!</p>
</div>
	
<div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search games...">
</div>

<div class="container">
    <div class="grid" id="gameGrid"></div>
</div>

<script>
const games = [
    {
        name:"Eagle Ride",
        page:"games/eagleride.html",
        thumb:"images/eagle-ride_16x9-cover.png"
    },
    // You can add more games here
    {
        name:"Speed Racer",
        page:"games/speedracer.html",
        thumb:"images/speed-racer.png"
    },
];

const grid = document.getElementById("gameGrid");
const searchInput = document.getElementById("searchInput");

function displayGames(filter = "") {
    grid.innerHTML = ""; // clear grid

    games
        .filter(game => game.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(game => {
            const card = document.createElement("a");
            card.href = game.page;
            card.className = "card";

            card.innerHTML = `
                <div class="thumb" style="background-image:url('${game.thumb}'); background-size:cover;"></div>
                <div class="name">${game.name}</div>
            `;

            grid.appendChild(card);
        });
}

// Initial load
displayGames();

// Search input event
searchInput.addEventListener("input", () => {
    displayGames(searchInput.value);
});
</script>

</body>
</html>
