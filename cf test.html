<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notepad - The Shoe Shelf</title>

<style>
body{
	margin:0;
	flex:1;
    font-family:Arial, Helvetica, sans-serif;
	cursor:default;
	min-height: 100vh;
    background-image: url('images/background.gif');
	background-size: cover;
    color:#ffffff
}

/* navi bar */

header{
	position:fixed;
	box-sizing: border-box;
	width:100%;
	background-color:rgba(0,0,0,0.75);
    border-bottom:4px solid #aa85ff;
    padding:18px;
	display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
	color:#aa85ff;
    font-size:26px;
	text-decoration:none;
    font-weight:bold;
    transition:.25s;
}

.logo:hover{
    color:#58fa59;
    transform:translateY(-5px) scale(1.02);
}

nav a{
	font-weight:bold;
    color:#aa85ff;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
    transition:.25s;
}

nav a:hover{
    color:#58fa59;
	transform:translateY(-5px) scale(1.02);
}

/* Layout */
.container{
    max-width:900px;
    margin:0 auto;
    padding:100px 20px 20px;
}

/* Card style */
.card{
    background:#141414;
    border:1px solid #262626;
    border-radius:14px;
    padding:16px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

/* Top bar */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

/* Title input */
#noteTitle{
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:18px;
    font-weight:600;
    width:100%;
}

/* Buttons */
.actions{
    display:flex;
    gap:8px;
}

button{
    background:#aa85ff;
    border:2px solid #58fa59;
    color:#58fa59;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:0.25s;
}

button:hover{
    background:#58fa59;
    color:#aa85ff;
    border-color:#aa85ff;
}

/* Editor */
#editor{
    width:100%;
    height:400px;
    background:#0d0d0d;
    border:1px solid #262626;
    border-radius:10px;
    padding:12px;
    color:#e5e5e5;
    font-size:15px;
    resize:none;
    outline:none;
    margin-top:10px;
}
</style>
<header>

<div>
<a href="index.html" class="logo">The Shoe Shelf</a>
</div>

<nav>
<a href="index.html">Home</a>
<a href="tools.html">Tools</a>
<a href="external.html">External</a>
<a href="games.html">Games</a>
<a href="about.html">About</a>
</nav>

</header>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="topbar">
            <input id="noteTitle" placeholder="Untitled Note">
            <div class="actions">
                <button onclick="clearNote()">Clear</button>
                <button onclick="downloadNote()">Download</button>
            </div>
        </div>

        <textarea id="editor" placeholder="Start typing..."></textarea>

    </div>
</div>

<script>
const editor = document.getElementById("editor");
const title = document.getElementById("noteTitle");

/* Load saved */
editor.value = localStorage.getItem("ss_note") || "";
title.value = localStorage.getItem("ss_title") || "";

/* Auto-save */
editor.addEventListener("input", save);
title.addEventListener("input", save);

function save(){
    localStorage.setItem("ss_note", editor.value);
    localStorage.setItem("ss_title", title.value);
}

/* Clear */
function clearNote(){
    if(confirm("Delete this note?")){
        editor.value = "";
        title.value = "";
        localStorage.removeItem("ss_note");
        localStorage.removeItem("ss_title");
    }
}

/* Download */
function downloadNote(){
    const content = title.value + "\n\n" + editor.value;
    const blob = new Blob([content], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (title.value || "note") + ".txt";
    a.click();
}
</script>

</body>
</html>
