<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/slimyshoeclear.png">

<title>The Shoe Shelf</title>

<style>
body{
	margin:0;
	flex:1;
    font-family:Arial, Helvetica, sans-serif;
	cursor:default;
	min-height: 100vh;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/80/Backgorund.gif');
	background-size: default;
    color:#ffffff
}

/* navi bar */

header{
	position:fixed;
	box-sizing: border-box;
	background-color:rgba(0,0,0,0.75);
    border-bottom:2px solid #aa85ff;
	width:100%;
    padding:18px;
	display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
	color:#aa85ff;
    font-size:26px;
	text-decoration:none;
    font-weight:bold;
    transition:.25s;
}

.logo:hover{
    color:#58fa59;
    transform:translateY(-5px) scale(1.02);
}

nav a{
	font-weight:bold;
    color:#aa85ff;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
    transition:.25s;
}

nav a:hover{
    color:#58fa59;
}

/* game box */

.container{
	padding:100px 20px;
    max-width:1024px;
    margin:auto;
}

.container h1{
	color:#aa85ff;
	font-weight:bold;
	transition:.25s;
}

.game-box{
    width:1024px;
    height:576px;
    background:#151515;
    border:1px solid #222;
    border-radius:14px;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* game buttons */

.controls{
    margin-top:10px;
    display:flex;
    gap:10px;
	justify-content:flex-end;
}

.button{
	font-weight:bold;
    padding:8px 12px;
    border-radius:8px;
    border:none;
    background:#aa85ff;
    color:#58fa59;
    cursor:pointer;
	transition:.25s;
}

.button:hover{
    background:#58fa59;
	color:#aa85ff;
}

.container h1:hover{
	color:#58fa59;
	transform:translateY(-5px)scale(1.02);
}

.description{
    margin-top:15px;
	color:#58fa59;
    background-color:rgba(0,0,0,0.75);
    border:2px solid #aa85ff;
    border-radius:14px;
    padding:15px;
}

</style>
</head>

<body>

<header>

<div>
<a href="../index.html" class="logo">The Shoe Shelf</a>
</div>

<nav>
<a href="../index.html">Home</a>
<a href="../tools.html">Tools</a>
<a href="../chatroom.html">Chat</a>
<a href="../games.html">Games</a>
<a href="../about.html">About</a>
</nav>

</header>

<div class="container">

    <h1>Example Game</h1>

	<div class="game-box">
		<div id="rt-fbfdbc3afeca28c65fc1975eeb5f4e11"></div> 
			<script src="https://rumbletalk.com/client/?VIj8SE~F">
			</script>
		</div>

    <div class="controls">
        <button class="button" onclick="fullscreen()">Fullscreen</button>
        <button class="button" onclick="openBlank()">about:blank</button>
    </div>

</div>

<script>
function fullscreen(){
    let iframe = document.getElementById("gameFrame");
    if(iframe.requestFullscreen){
        iframe.requestFullscreen();
    }
}

function openBlank(){
    let win = window.open("about:blank");
    let iframe = win.document.createElement("iframe");
    iframe.src = document.getElementById("gameFrame").src;
    iframe.style.border = "none";
    iframe.style.width = "100vw";
    iframe.style.height = "100vh";
    win.document.body.style.margin = "0";
    win.document.body.appendChild(iframe);
}
</script>

</body>
</html>
