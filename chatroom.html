<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shoe Shelf | Chatroom</title>

<link rel="icon" href="favicon.ico">

<style>

body{
	margin:0;
	flex:1;
    font-family:Arial, Helvetica, sans-serif;
	cursor:default;
	min-height: 100vh;
    background-image: url('images/background.gif');
	background-size: cover;
    color:#ffffff
}

/* Header */

header{
	position:fixed;
	box-sizing: border-box;
	width:100%;
	background-color:rgba(0,0,0,0.75);
    border-bottom:2px solid #aa85ff;
    padding:18px;
	display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
	color:#aa85ff;
    font-size:26px;
	text-decoration:none;
    font-weight:bold;
    transition:.25s;
}

.logo:hover{
    color:#58fa59;
    transform:translateY(-5px) scale(1.02);
}

nav a{
	font-weight:bold;
    color:#aa85ff;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
    transition:.25s;
}

nav a:hover{
    color:#58fa59;
}

/* Main */

.wrapper{

max-width:1200px;

margin:auto;

padding:40px 20px;

}

.hero{

text-align:center;

margin-bottom:35px;

}

.hero h1{

font-size:42px;

color:#aa85ff;

margin-bottom:10px;

}

.hero p{

opacity:.8;

}

/* Chat Card */

.chat-card{

background:rgba(30,30,40,.6);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

border-radius:24px;

padding:30px;

box-shadow:
0 0 35px rgba(170,133,255,.12);

transition:.3s;

}

.chat-card:hover{

box-shadow:
0 0 50px rgba(170,133,255,.2);

}

/* Footer */

footer{

margin-top:40px;

text-align:center;

opacity:.5;

padding:20px;

}

/* Scrollbar */

::-webkit-scrollbar{

width:10px;

}

::-webkit-scrollbar-thumb{

background:#aa85ff;

border-radius:50px;

}

::-webkit-scrollbar-track{

background:#171717;

}

</style>

</head>

<body>

<header>

<div>
	<a href="index.html" class="logo">The Shoe Shelf</a>
</div>
	<nav>
		<a href="index.html">Home</a>
		<a href="tools.html">Tools</a>
		<a href="chatroom.html">Chat</a>
		<a href="games.html">Games</a>
		<a href="about.html">About</a>
	</nav>
</header>

<section class="hero">
	<h1>The Shoe Shelf</h1>
	<p>Sponsored by Richmond.</p>
</section>

<div class="wrapper">

<div class="hero">

<h1>Chatroom</h1>

<p>
Talk with other Shoe Shelf users, ask questions, or just hang out.
</p>

</div>

<div class="chat-card">

<!-- Giscus -->

<script src="https://giscus.app/client.js"
        data-repo="slimeyshoe/slimeyshoe.github.io"
        data-repo-id="R_kgDOQ-nRsw"
        data-category-id="DIC_kwDOQ-nRs84DAEiZ"
        data-mapping="specific"
        data-term="chatroom"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>


</div>

</div>

<footer>

© 2026 The Shoe Shelf

</footer>

</body>
</html>
