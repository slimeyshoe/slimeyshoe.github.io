<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home - Classroom</title>
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background-color:black;
    color: white;
}

header{
	position:fixed;
	box-sizing: border-box;
	width:100%;
	background-color:rgba(0,0,0,0.75);
    border-bottom:2px solid #aa85ff;
    padding:18px;
	display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
	color:#aa85ff;
    font-size:26px;
	text-decoration:none;
    font-weight:bold;
    transition:.25s;
}

.logo:hover{
    color:#58fa59;
    transform:translateY(-5px) scale(1.02);
}

nav a{
	font-weight:bold;
    color:#aa85ff;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
    transition:.25s;
}

nav a:hover{
    color:#58fa59;
	transform:translateY(-5px) scale(1.02);
}

.main {
    padding-top: 100px;
    text-align: center;
}

input {
    padding: 8px 12px;
    text-align: center;
}

button {
    margin-top: 10px;
    padding: 8px 12px;
    text-align:center;
    cursor: pointer;
}

.footer {
    margin-top: 100px;
    text-align: center;
    font-size: 20px;
}
</style>
</head>

<body>

<header>

<div>
<a href="index.html" class="logo">The Shoe Shelf</a>
</div>

<nav>
<a href="/index.html">Home</a>
<a href="/tools.html">Tools</a>
<a href="/chatroom.html">Chat</a>
<a href="/games.html">Games</a>
<a href="/about.html">About</a>
</nav>

</header>

<div class="main">

    <h1 style="font-size:40px;">
        Tuckerman <span style="color:red;">Embedder</span>
    </h1>

    <button href="#" id="macvgabout">
        Open in about:blank
    </button>

<div>
    <button id="downloadBtn" style="margin-top: 10px; padding: 8px 12px; cursor: pointer;">
    Download The Page
</button>
</div>

    <h2>Enter the website you wish to embed below:</h2>

    <form id="embedForm">
        <input type="text" id="name5" placeholder="Enter a website URL">
        <br>
        <button type="submit">Ascend to Agartha!</button>
    </form>

    <img src="https://cmsv2-assets.apptegy.net/uploads/4189/logo/3514/logo.png"
         width="110" height="110"
         style="border-radius:50%; margin-top:40px;">

</div>
    
<footer class="footer">
    <strong>© CF, ZL, AH. All rights reserved.</strong><br>
    <strong>GOD <span style="color:#0038b8;">BLESS</span> ISRAEL!</strong>
</footer>

<script>
/* Download page functionality */
document.getElementById("downloadBtn").addEventListener("click", () => {
    // Get the current HTML of the page
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    
    // Create a Blob with the HTML content
    const blob = new Blob([htmlContent], { type: "text/html" });
    
    // Create a temporary link to trigger the download
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Tuckerman Embedder.html";
    a.click();
    
    URL.revokeObjectURL(a.href);
});

const form = document.getElementById("embedForm");
const urlInput = document.getElementById("name5");

/* Prevent reload */
form.addEventListener("submit", (e) => {
    e.preventDefault();
    embed();
});

/* about:blank opener */
document.getElementById("macvgabout").addEventListener("click", (e) => {
    e.preventDefault();

    const win = window.open();
    const iframe = win.document.createElement("iframe");

    iframe.style = "border:none;width:100%;height:100%";
    iframe.src = window.location.href;

    win.document.body.style.margin = "0";
    win.document.body.appendChild(iframe);
});

/* embed function */
function embed() {
    let url = urlInput.value.trim();

    if (!url.startsWith("https://") && !url.startsWith("http://")) {
        url = "https://" + url;
    }

    const win = window.open();
    const iframe = win.document.createElement("iframe");

    iframe.style = "border:none;width:100%;height:100%";
    iframe.src = url;

    win.document.body.style.margin = "0";
    win.document.body.appendChild(iframe);
}

</script>

</body>
</html>
